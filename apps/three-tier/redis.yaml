apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote-db
  namespace: default
  labels:
    app: vote-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote-db
  template:
    metadata:
      labels:
        app: vote-db
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
---
apiVersion: v1
kind: Service
metadata:
  name: vote-db-service
  namespace: default
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: vote-db

